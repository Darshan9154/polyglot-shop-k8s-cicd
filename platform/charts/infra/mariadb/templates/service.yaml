{{/*
Two Services, on purpose.

The headless Service (clusterIP: None) gives the StatefulSet its stable per-pod DNS
name and is what `serviceName` refers to. The regular ClusterIP Service gives clients
a single address, which is what the application charts connect to at
mariadb.data.svc.cluster.local. Collapsing these into one would either break the
StatefulSet's identity or make clients resolve every pod individually.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mariadb.headless" . }}
  labels:
    {{ include "mariadb.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
  selector:
    {{ include "mariadb.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mariadb.fullname" . }}
  labels:
    {{ include "mariadb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
  selector:
    {{ include "mariadb.selectorLabels" . | nindent 4 }}
