{{/*
Two Services for the same pods.

Why two: the OpenTelemetry Collector forwards spans to a host named
"jaeger-collector.monitoring.svc.cluster.local", and Grafana queries a data source
pointed at the UI. Naming the ingest service "collector" and the read service after the
release keeps each name describing what it is for. A single Service would force one of
the two names to be misleading.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  labels:
    {{- include "jaeger.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: {{ (index .Values.service.ports "otlp-grpc") }}
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: {{ (index .Values.service.ports "otlp-http") }}
      targetPort: otlp-http
      protocol: TCP
  selector:
    {{- include "jaeger.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jaeger.fullname" . }}
  labels:
    {{- include "jaeger.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: ui
      port: {{ .Values.service.ports.ui }}
      targetPort: ui
      protocol: TCP
    # Why the admin port is exposed internally: it is the endpoint used for health checks
    # and for troubleshooting, and it should be reachable without exposing it further.
    - name: admin
      port: {{ .Values.service.ports.admin }}
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "jaeger.selectorLabels" . | nindent 4 }}
