# -------------------------------
# 00 - Namespace
# -------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: retail-store
---
# -------------------------------
# 01 - Secrets (DB creds, RabbitMQ)
# -------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: retail-store
type: Opaque
data:
  POSTGRES_DB: b3JkZXJz           # orders
  POSTGRES_USER: b3JkZXJzX3VzZXI= # orders_user
  POSTGRES_PASSWORD: c2VjcmV0MTIz # secret123
  RABBITMQ_USER: cmFiYml0bXE=     # rabbitmq
  RABBITMQ_PASS: c2VjcmV0MTIz     # secret123
---
# -------------------------------
# 10 - RabbitMQ (StatefulSet)
# -------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: retail-store
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
        - containerPort: 5672
        - containerPort: 15672
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RABBITMQ_USER
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RABBITMQ_PASS
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: retail-store
spec:
  ports:
  - port: 5672
    name: amqp
  - port: 15672
    name: mgmt
  selector:
    app: rabbitmq
---
# -------------------------------
# 22 - Postgres (Orders DB)
# -------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders-db
  namespace: retail-store
spec:
  serviceName: orders-db
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  template:
    metadata:
      labels:
        app: orders-db
    spec:
      containers:
      - name: postgres
        image: postgres:16.1
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: app-secrets
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp2
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  namespace: retail-store
spec:
  ports:
  - port: 5432
  selector:
    app: orders-db
---
# -------------------------------
# 31 - MariaDB (Catalog DB)
# -------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-db
  namespace: retail-store
spec:
  serviceName: catalog-db
  replicas: 1
  selector:
    matchLabels:
      app: catalog-db
  template:
    metadata:
      labels:
        app: catalog-db
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.9
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
        - name: MYSQL_DATABASE
          value: catalogdb
        - name: MYSQL_USER
          value: catalog_user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mariadb-data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mariadb-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp2
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-db
  namespace: retail-store
spec:
  ports:
  - port: 3306
  selector:
    app: catalog-db
---
# -------------------------------
# 30 - Redis (Checkout)
# -------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: checkout-redis
  namespace: retail-store
spec:
  serviceName: checkout-redis
  replicas: 1
  selector:
    matchLabels:
      app: checkout-redis
  template:
    metadata:
      labels:
        app: checkout-redis
    spec:
      containers:
      - name: redis
        image: redis:6.0-alpine
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp2
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-redis
  namespace: retail-store
spec:
  ports:
  - port: 6379
  selector:
    app: checkout-redis
---
# -------------------------------
# 32 - DynamoDB Local (Cart)
# -------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts-db
  namespace: retail-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carts-db
  template:
    metadata:
      labels:
        app: carts-db
    spec:
      containers:
      - name: dynamodb
        image: amazon/dynamodb-local:1.20.0
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: carts-db
  namespace: retail-store
spec:
  ports:
  - port: 8000
  selector:
    app: carts-db
---
# -------------------------------
# 40 - Catalog Service
# -------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: retail-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
      - name: catalog
        image: 517178430929.dkr.ecr.eu-north-1.amazonaws.com/catalog:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: retail-store
spec:
  ports:
  - port: 8080
  selector:
    app: catalog
---
# -------------------------------
# 41 - Orders Service
# -------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: retail-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      imagePullSecrets:
        - name: ecr-secret
      initContainers:
      - name: wait-for-db
        image: busybox
        command: ['sh', '-c', 'until nc -z orders-db 5432; do echo waiting for db; sleep 2; done;']
      - name: wait-for-rabbitmq
        image: busybox
        command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done;']
      containers:
      - name: orders
        image: 517178430929.dkr.ecr.eu-north-1.amazonaws.com/orders:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: retail-store
spec:
  ports:
  - port: 8080
  selector:
    app: orders
---
# -------------------------------
