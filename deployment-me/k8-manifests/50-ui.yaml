apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: retail-store
spec:
  selector: { app: ui }
  ports:
    - port: 8080
      targetPort: 8080
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: retail-store
  labels: { app: ui }
spec:
  replicas: 1
  selector: { matchLabels: { app: ui } }
  template:
    metadata:
      labels: { app: ui }
    spec:
      containers:
        - name: ui
          image: 517178430929.dkr.ecr.eu-north-1.amazonaws.com/ui:latest
          ports: [ { containerPort: 8080 } ]
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom"
            - name: SERVER_TOMCAT_ACCESSLOG_ENABLED
              value: "true"
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
