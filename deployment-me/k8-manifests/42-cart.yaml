apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: retail-store
spec:
  selector: { app: cart }
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: retail-store
  labels: { app: cart }
spec:
  replicas: 1
  selector: { matchLabels: { app: cart } }
  template:
    metadata:
      labels: { app: cart }
    spec:
      initContainers:
        - name: wait-for-dynamodb
          image: curlimages/curl:8.11.1
          command: [ "sh", "-c", "until curl -s http://carts-db:8000; do echo waiting for dynamodb; sleep 3; done" ]
      containers:
        - name: cart
          image: 517178430929.dkr.ecr.eu-north-1.amazonaws.com/cart:latest
          ports: [ { containerPort: 8080 } ]
          env:
            - name: SERVER_TOMCAT_ACCESSLOG_ENABLED
              value: "true"
            - name: RETAIL_CART_PERSISTENCE_PROVIDER
              value: "dynamodb"
            - name: RETAIL_CART_PERSISTENCE_DYNAMODB_ENDPOINT
              value: "http://carts-db:8000"
            - name: RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              value: "key"
            - name: AWS_SECRET_ACCESS_KEY
              value: "dummy"
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
