{{/*
Two Services, on purpose.

The headless Service (clusterIP: None) gives the StatefulSet its stable per-pod DNS
name and is what `serviceName` refers to. The regular ClusterIP Service gives clients
a single address, which is what the application charts connect to at
redis.data.svc.cluster.local. Collapsing these into one would either break the
StatefulSet's identity or make clients resolve every pod individually.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis.headless" . }}
  labels:
    {{ include "redis.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{ include "redis.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis.fullname" . }}
  labels:
    {{ include "redis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{ include "redis.selectorLabels" . | nindent 4 }}
