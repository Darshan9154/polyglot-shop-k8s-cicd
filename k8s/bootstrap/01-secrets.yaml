# Central credential storage for the application and its backing services.
#
# Why a single file and a single source: the Compose deployment read one
# DB_PASSWORD from deployment-me/.env and reused it across MariaDB, PostgreSQL and
# RabbitMQ. Reproducing that here keeps a single place to change, but it also
# means one leaked value exposes all three. Splitting the keys per dependency is a
# one-line change and is called out in the chart values.
#
# Why this file is a template and not a committed secret: the values below are
# placeholders. Do not commit real credentials. Two supported ways to supply them:
#
#   Option A - replace the placeholders before applying (fine for a test cluster):
#       kubectl apply -f bootstrap/01-secrets.yaml
#
#   Option B - create the Secret out of band and never write it to disk:
#       kubectl -n data create secret generic polyglot-secrets \
#         --from-literal=DB_PASSWORD="$(openssl rand -base64 24)"
#       kubectl -n retail-store create secret generic polyglot-secrets \
#         --from-literal=DB_PASSWORD="<same value>"
#
# The Secret is created in both namespaces because the application consumes its
# credentials and the databases consume theirs, and Kubernetes Secrets are
# namespace-scoped. External Secrets Operator or the Secrets Store CSI driver is
# the production answer when a real secret manager is available.
---
apiVersion: v1
kind: Secret
metadata:
  name: polyglot-secrets
  namespace: data
  labels:
    app.kubernetes.io/part-of: polyglot-shop
type: Opaque
stringData:
  # Used by MariaDB (catalog) and PostgreSQL (orders) and RabbitMQ (orders).
  DB_PASSWORD: "CHANGE_ME_BEFORE_APPLYING"
---
apiVersion: v1
kind: Secret
metadata:
  name: polyglot-secrets
  namespace: retail-store
  labels:
    app.kubernetes.io/part-of: polyglot-shop
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME_BEFORE_APPLYING"
